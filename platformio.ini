[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

lib_deps =
    earlephilhower/ESP8266Audio @ ^1.9.7

  
[env:3sec]
lib_deps =
    ${env.lib_deps}   
build_src_filter =
    +<3sec/>
    -<radio/>

   
[env:radio]
lib_deps =
    ${env.lib_deps}   
build_src_filter =
    +<radio/>
    -<3sec/>